<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareerCompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:        #0d0d0f;
  --surface:   #141417;
  --card:      #1b1b20;
  --border:    #2a2a32;
  --border-hi: #3e3e50;
  --gold:      #c9a84c;
  --gold-dim:  #8a6f32;
  --teal:      #3ecfb2;
  --teal-dim:  #1f7a6a;
  --rose:      #e05c6a;
  --text:      #e8e6e0;
  --muted:     #7a7880;
  --label:     #b0adb8;
  --ff-head:   'Playfair Display', Georgia, serif;
  --ff-body:   'DM Sans', sans-serif;
  --ff-mono:   'DM Mono', monospace;
  --ease:      cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ff-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════
   NOISE GRAIN OVERLAY
═══════════════════════════════════════════ */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}

/* ═══════════════════════════════════════════
   LAYOUT SHELL
═══════════════════════════════════════════ */
#app {
  position: relative;
  z-index: 1;
  max-width: 860px;
  margin: 0 auto;
  padding: 2rem 1.5rem 6rem;
}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.site-header {
  text-align: center;
  padding: 3.5rem 0 2.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 3rem;
}
.site-header .wordmark {
  font-family: var(--ff-head);
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--gold) 0%, #e8d59a 50%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.site-header .tagline {
  margin-top: 0.5rem;
  color: var(--muted);
  font-size: 0.9rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════
   STEP PROGRESS INDICATOR
═══════════════════════════════════════════ */
.step-rail {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-bottom: 3rem;
}
.step-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  cursor: default;
}
.step-circle {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-mono);
  font-size: 0.8rem;
  color: var(--muted);
  transition: all 0.35s var(--ease);
  position: relative;
}
.step-node.active .step-circle {
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 0 4px rgba(201,168,76,0.12);
}
.step-node.done .step-circle {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg);
}
.step-label {
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.step-node.active .step-label { color: var(--gold); }
.step-node.done .step-label { color: var(--gold-dim); }
.step-connector {
  width: 64px; height: 2px;
  background: var(--border);
  margin: 0 4px;
  margin-bottom: 22px;
  transition: background 0.35s;
}
.step-connector.done { background: var(--gold-dim); }

/* ═══════════════════════════════════════════
   SCREENS (fade in/out)
═══════════════════════════════════════════ */
.screen {
  animation: fadeUp 0.45s var(--ease) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════
   SECTION TITLES
═══════════════════════════════════════════ */
.section-eyebrow {
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.5rem;
}
.section-title {
  font-family: var(--ff-head);
  font-size: clamp(1.4rem, 4vw, 2rem);
  line-height: 1.2;
  margin-bottom: 0.8rem;
}
.section-subtitle {
  color: var(--label);
  max-width: 56ch;
  margin-bottom: 2.5rem;
}

/* ═══════════════════════════════════════════
   RIASEC QUESTIONNAIRE
═══════════════════════════════════════════ */
.riasec-category {
  margin-bottom: 2.5rem;
}
.cat-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.cat-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cat-name {
  font-family: var(--ff-mono);
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--teal);
}
.question-row {
  display: grid;
  gap: 0.5rem;
  margin-bottom: 1.1rem;
}
.q-text {
  font-size: 0.9rem;
  color: var(--label);
  padding-right: 1rem;
}
.likert {
  display: flex;
  gap: 0.4rem;
}
.likert label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  cursor: pointer;
}
.likert label span.num {
  font-family: var(--ff-mono);
  font-size: 0.72rem;
  color: var(--muted);
}
.likert input[type=radio] { display: none; }
.likert label .dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid var(--border);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.likert label:hover .dot { border-color: var(--border-hi); }
.likert input[type=radio]:checked + .dot {
  background: var(--teal);
  border-color: var(--teal);
  box-shadow: 0 0 12px rgba(62,207,178,0.3);
}
.likert-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: -0.2rem;
  padding: 0 2px;
}

/* Progress bar */
.q-progress {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 2rem;
  overflow: hidden;
}
.q-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal-dim), var(--teal));
  border-radius: 2px;
  transition: width 0.4s var(--ease);
}

/* ═══════════════════════════════════════════
   RIASEC PROFILE RADAR (CSS bars)
═══════════════════════════════════════════ */
.profile-bars {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin: 1.5rem 0 2rem;
}
.profile-bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 48px;
  align-items: center;
  gap: 0.75rem;
}
.pb-label {
  font-family: var(--ff-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--label);
}
.pb-track {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.pb-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.8s var(--ease);
}
.pb-val {
  font-family: var(--ff-mono);
  font-size: 0.72rem;
  color: var(--gold);
  text-align: right;
}

/* ═══════════════════════════════════════════
   CAREER CARDS
═══════════════════════════════════════════ */
.career-grid {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.career-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  position: relative;
  overflow: hidden;
}
.career-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--teal);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.3s var(--ease);
}
.career-card:hover { border-color: var(--border-hi); transform: translateX(3px); }
.career-card:hover::before { transform: scaleY(1); }
.career-card.selected {
  border-color: var(--teal);
  background: rgba(62,207,178,0.05);
}
.career-card.selected::before { transform: scaleY(1); }
.career-rank {
  position: absolute;
  top: 1rem; right: 1.25rem;
  font-family: var(--ff-mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.career-title {
  font-family: var(--ff-head);
  font-size: 1.05rem;
  margin-bottom: 0.35rem;
  padding-right: 3rem;
}
.career-desc {
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 0.75rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.career-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.score-pill {
  font-family: var(--ff-mono);
  font-size: 0.68rem;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid;
  letter-spacing: 0.06em;
}
.score-pill.gold { color: var(--gold); border-color: var(--gold-dim); }
.score-pill.teal { color: var(--teal); border-color: var(--teal-dim); }
.score-pill.muted { color: var(--muted); border-color: var(--border); }
.riasec-mini {
  font-family: var(--ff-mono);
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.04em;
}

/* ═══════════════════════════════════════════
   INTEREST TEXT AREA
═══════════════════════════════════════════ */
.interest-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.2rem;
  transition: border-color 0.2s;
  margin-bottom: 1.5rem;
}
.interest-box:focus-within { border-color: var(--teal); }
.interest-box textarea {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--ff-body);
  font-size: 0.95rem;
  line-height: 1.7;
  padding: 1rem 1.25rem;
  resize: vertical;
  min-height: 140px;
}
.interest-box textarea::placeholder { color: var(--muted); }

/* ═══════════════════════════════════════════
   SKILL TAGS INPUT
═══════════════════════════════════════════ */
.skill-input-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  transition: border-color 0.2s;
}
.skill-input-wrap:focus-within { border-color: var(--teal); }
.skill-input-wrap input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--ff-body);
  font-size: 0.95rem;
  padding: 0;
}
.skill-input-wrap input::placeholder { color: var(--muted); }
.skill-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; }

/* ═══════════════════════════════════════════
   SKILL GAP RESULTS
═══════════════════════════════════════════ */
.gap-summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.gap-stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.25rem;
  text-align: center;
}
.gap-stat-val {
  font-family: var(--ff-head);
  font-size: 2rem;
  line-height: 1;
  margin-bottom: 0.3rem;
}
.gap-stat-val.gold { color: var(--gold); }
.gap-stat-val.teal { color: var(--teal); }
.gap-stat-val.rose { color: var(--rose); }
.gap-stat-label {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.coverage-ring {
  text-align: center;
  margin-bottom: 2rem;
}
.coverage-ring svg { overflow: visible; }

.skill-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 2rem;
}
@media (max-width: 560px) { .skill-columns { grid-template-columns: 1fr; } }

.skill-col-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}
.skill-col-icon { font-size: 1rem; }
.skill-col-title {
  font-family: var(--ff-mono);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.skill-col-title.have { color: var(--teal); }
.skill-col-title.gap  { color: var(--rose); }

.skill-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 6px;
  margin: 3px;
  border: 1px solid;
}
.skill-tag.have { color: var(--teal); border-color: rgba(62,207,178,0.25); background: rgba(62,207,178,0.06); }
.skill-tag.gap  { color: var(--rose); border-color: rgba(224,92,106,0.25); background: rgba(224,92,106,0.06); }

.matched-job-note {
  background: rgba(201,168,76,0.07);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.8rem;
  color: var(--label);
  margin-bottom: 1.5rem;
}
.matched-job-note strong { color: var(--gold); }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.8rem;
  border-radius: 8px;
  font-family: var(--ff-body);
  font-size: 0.88rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  border: none;
  outline: none;
}
.btn-primary {
  background: var(--gold);
  color: #0d0d0f;
}
.btn-primary:hover { background: #dbb95a; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,168,76,0.3); }
.btn-secondary {
  background: transparent;
  color: var(--label);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--border-hi); color: var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.btn-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }

/* ═══════════════════════════════════════════
   LOADING SPINNER
═══════════════════════════════════════════ */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5rem 0;
  gap: 1.5rem;
}
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--muted); font-size: 0.88rem; }

/* ═══════════════════════════════════════════
   ERROR STATE
═══════════════════════════════════════════ */
.error-banner {
  background: rgba(224,92,106,0.08);
  border: 1px solid rgba(224,92,106,0.3);
  border-radius: 10px;
  padding: 1rem 1.25rem;
  color: var(--rose);
  font-size: 0.88rem;
  margin-bottom: 1.5rem;
}

/* ═══════════════════════════════════════════
   WELCOME SCREEN
═══════════════════════════════════════════ */
.welcome-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin: 2rem 0 3rem;
}
@media (max-width: 560px) { .welcome-grid { grid-template-columns: 1fr; } }
.welcome-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
}
.welcome-card-num {
  font-family: var(--ff-head);
  font-size: 2.5rem;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 0.5rem;
  opacity: 0.6;
}
.welcome-card-title { font-weight: 500; margin-bottom: 0.4rem; }
.welcome-card-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

/* ═══════════════════════════════════════════
   DIVIDER
═══════════════════════════════════════════ */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 2rem 0;
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 2rem; right: 2rem;
  background: var(--card);
  border: 1px solid var(--border-hi);
  border-radius: 10px;
  padding: 0.9rem 1.25rem;
  font-size: 0.85rem;
  color: var(--label);
  z-index: 100;
  animation: slideIn 0.3s var(--ease);
}
@keyframes slideIn {
  from { transform: translateY(10px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
</style>
</head>

<body>
<div id="app">
  <!-- Rendered by JS below -->
</div>

<script>
/* ════════════════════════════════════════════════════════
   CareerCompass — vanilla JS SPA
   No bundler required. Runs from Flask static folder.
════════════════════════════════════════════════════════ */

const API = ''; // same origin — Flask serves both

const RIASEC_COLORS = {
  Realistic:     '#e08c3e',
  Investigative: '#3e9ce0',
  Artistic:      '#b43ee0',
  Social:        '#3ecfb2',
  Enterprising:  '#e05c6a',
  Conventional:  '#8ea4c8',
};

// ─── STATE ───────────────────────────────────────────
const state = {
  step: 0,          // 0=welcome 1=riasec 2=obj1results 3=interests 4=top10 5=skillgap 6=results
  questions: [],
  answers: {},      // { Realistic: [1,3,5,2,4], ... }
  obj1Result: null, // {careers, profile}
  interestText: '',
  obj2Result: null, // {top10, obj1_display}
  selectedCareer: null,
  userSkills: '',
  gapResult: null,
  loading: false,
  error: null,
};

// ─── RENDER ENGINE ───────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = buildApp();
  attachEvents();
}

function buildApp() {
  return `
    ${buildHeader()}
    ${buildStepRail()}
    <div class="screen" key="${state.step}">
      ${buildScreen()}
    </div>
  `;
}

function buildHeader() {
  return `
    <header class="site-header">
      <div class="wordmark">CareerCompass</div>
      <div class="tagline">Discover · Match · Navigate</div>
    </header>
  `;
}

const STEPS = ['Welcome', 'RIASEC', 'Obj 1', 'Interests', 'Top 10', 'Skill Gap', 'Results'];

function buildStepRail() {
  const visible = [0,1,2,3,4,5,6];
  let html = '<div class="step-rail">';
  visible.forEach((s, idx) => {
    const cls = state.step > s ? 'done' : state.step === s ? 'active' : '';
    html += `<div class="step-node ${cls}">
      <div class="step-circle">${state.step > s ? '✓' : (s + 1)}</div>
      <div class="step-label">${STEPS[s]}</div>
    </div>`;
    if (idx < visible.length - 1) {
      html += `<div class="step-connector ${state.step > s ? 'done' : ''}"></div>`;
    }
  });
  html += '</div>';
  return html;
}

function buildScreen() {
  if (state.loading) return buildLoading();
  if (state.step === 0) return buildWelcome();
  if (state.step === 1) return buildRIASEC();
  if (state.step === 2) return buildObj1Results();
  if (state.step === 3) return buildInterests();
  if (state.step === 4) return buildTop10();
  if (state.step === 5) return buildSkillGap();
  if (state.step === 6) return buildGapResults();
  return '';
}

// ─── RIASEC QUESTIONNAIRE ─────────────────────────────
let currentCatIdx = 0;
const CAT_ORDER = ['Realistic','Investigative','Artistic','Social','Enterprising','Conventional'];

function buildRIASEC() {
  if (!state.questions.length) return '<div class="loading-state"><div class="spinner"></div></div>';

  const cat = CAT_ORDER[currentCatIdx];
  const catQs = state.questions.filter(q => q.category === cat);
  const catAnswers = state.answers[cat] || [];
  const totalAnswered = Object.values(state.answers).reduce((a,b) => a + b.length, 0);
  const totalQ = 30;
  const pct = Math.round(totalAnswered / totalQ * 100);

  let html = `
    <div class="section-eyebrow">Step 1 of 3 — Personality Assessment</div>
    <div class="section-title">RIASEC Career Interest Survey</div>
    <div class="section-subtitle">Rate each statement 1 (Strongly Disagree) to 5 (Strongly Agree). Be honest — there are no right answers.</div>
    <div class="q-progress"><div class="q-progress-fill" style="width:${pct}%"></div></div>
    <div class="riasec-category">
      <div class="cat-header">
        <div class="cat-dot" style="background:${RIASEC_COLORS[cat]}"></div>
        <div class="cat-name">${cat} (${currentCatIdx + 1}/6)</div>
      </div>
  `;

  catQs.forEach((q, qi) => {
    const val = catAnswers[qi] || 0;
    html += `
      <div class="question-row">
        <div class="q-text">${qi + 1}. ${q.text}</div>
        <div class="likert" id="lk-${qi}">
          ${[1,2,3,4,5].map(n => `
            <label>
              <input type="radio" name="q${qi}" value="${n}" ${val === n ? 'checked' : ''} data-qi="${qi}" data-cat="${cat}" />
              <div class="dot"></div>
              <span class="num">${n}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
  });

  html += `
      <div class="likert-labels"><span>Strongly Disagree</span><span>Strongly Agree</span></div>
    </div>
  `;

  const catDone = (catAnswers.length === catQs.length) && catAnswers.every(v => v > 0);
  const isLast = currentCatIdx === CAT_ORDER.length - 1;

  html += `
    ${state.error ? `<div class="error-banner">${state.error}</div>` : ''}
    <div class="btn-row">
      ${currentCatIdx > 0 ? `<button class="btn btn-secondary" id="btn-prev-cat">← Back</button>` : ''}
      ${!isLast ? `<button class="btn btn-primary" id="btn-next-cat" ${!catDone?'disabled':''}>Next Category →</button>` : ''}
      ${isLast ? `<button class="btn btn-primary" id="btn-submit-riasec" ${!catDone?'disabled':''}>Analyze My Profile →</button>` : ''}
    </div>
  `;

  return html;
}

// ─── GAP RESULTS ─────────────────────────────────────
function buildGapResults() {
  const r = state.gapResult;
  const covPct = r.coverage_pct;

  // SVG ring
  const R = 54, cx = 70, cy = 70;
  const circ = 2 * Math.PI * R;
  const dash = (covPct / 100) * circ;

  return `
    <div class="section-eyebrow">Skill Gap Analysis — Results</div>
    <div class="section-title" style="margin-bottom:0.5rem">Your Development Roadmap</div>

    <div class="matched-job-note">
      🔍 Your selected career "<strong>${r.selected_career}</strong>" was matched to
      "<strong>${r.matched_job}</strong>" in the skills database.
    </div>

    <div class="gap-summary-grid">
      <div class="gap-stat">
        <div class="gap-stat-val gold">${r.total_required}</div>
        <div class="gap-stat-label">Skills Required</div>
      </div>
      <div class="gap-stat">
        <div class="gap-stat-val teal">${r.have.length}</div>
        <div class="gap-stat-label">You Already Have</div>
      </div>
      <div class="gap-stat">
        <div class="gap-stat-val rose">${r.gap.length}</div>
        <div class="gap-stat-label">Skills to Develop</div>
      </div>
      <div class="gap-stat">
        <div class="gap-stat-val ${covPct >= 60 ? 'teal' : covPct >= 30 ? 'gold' : 'rose'}">${covPct}%</div>
        <div class="gap-stat-label">Coverage</div>
      </div>
    </div>

    <div class="coverage-ring">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--border)" stroke-width="10"/>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none"
          stroke="${covPct >= 60 ? 'var(--teal)' : covPct >= 30 ? 'var(--gold)' : 'var(--rose)'}"
          stroke-width="10"
          stroke-linecap="round"
          stroke-dasharray="${dash} ${circ}"
          transform="rotate(-90 ${cx} ${cy})"
          style="transition: stroke-dasharray 1s ease"
        />
        <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle"
              font-family="Playfair Display" font-size="18" fill="var(--text)">${covPct}%</text>
        <text x="${cx}" y="${cy+22}" text-anchor="middle"
              font-family="DM Sans" font-size="9" fill="var(--muted)" letter-spacing="1">COVERAGE</text>
      </svg>
    </div>

    <div class="skill-columns">
      <div>
        <div class="skill-col-header">
          <span class="skill-col-icon">✅</span>
          <span class="skill-col-title have">Skills You Have (${r.have.length})</span>
        </div>
        <div>
          ${r.have.length ? r.have.map(s => `<span class="skill-tag have">✓ ${s}</span>`).join('') : '<span style="color:var(--muted);font-size:0.82rem">None matched</span>'}
        </div>
      </div>
      <div>
        <div class="skill-col-header">
          <span class="skill-col-icon">🚀</span>
          <span class="skill-col-title gap">Skills to Develop (${r.gap.length})</span>
        </div>
        <div>
          ${r.gap.length ? r.gap.map(s => `<span class="skill-tag gap">+ ${s}</span>`).join('') : '<span style="color:var(--teal);font-size:0.82rem">You have all required skills! 🎉</span>'}
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-restart">↺ Start Over</button>
      <button class="btn btn-primary" id="btn-back-to-top10-from-results">Try Another Career</button>
    </div>
  `;
}

// ─── HELPERS ─────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function setLoading(v) { state.loading = v; render(); }

async function apiCall(path, body) {
  const opts = body
    ? { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }
    : { method: 'GET' };
  const res = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'API error');
  return data;
}

// ─── EVENTS ──────────────────────────────────────────
function attachEvents() {
  // Welcome
  on('btn-start', async () => {
    state.error = null;
    if (!state.questions.length) {
      setLoading(true);
      try {
        const d = await apiCall('/api/questions');
        state.questions = d.questions;
      } catch(e) {
        state.error = e.message;
        setLoading(false);
        return;
      }
      setLoading(false);
    }
    currentCatIdx = 0;
    state.step = 1;
    render();
  });

  // RIASEC nav
  on('btn-prev-cat', () => { currentCatIdx--; render(); });
  on('btn-next-cat', () => { currentCatIdx++; render(); });
  on('btn-submit-riasec', async () => {
    state.error = null;
    setLoading(true);
    try {
      const result = await apiCall('/api/objective1', { answers: state.answers });
      state.obj1Result = result;
      state.step = 2;
    } catch(e) {
      state.error = e.message;
    }
    setLoading(false);
  });

  // Likert radios
  document.querySelectorAll('input[type=radio]').forEach(inp => {
    inp.addEventListener('change', () => {
      const cat = inp.dataset.cat;
      const qi = parseInt(inp.dataset.qi);
      const val = parseInt(inp.value);
      if (!state.answers[cat]) state.answers[cat] = [];
      state.answers[cat][qi] = val;

      // re-render just buttons to update disabled state
      const catQs = state.questions.filter(q => q.category === cat);
      const catAnswers = state.answers[cat] || [];
      const catDone = catAnswers.length === catQs.length && catAnswers.every(v => v > 0);
      const isLast = currentCatIdx === CAT_ORDER.length - 1;
      const btn = document.getElementById(isLast ? 'btn-submit-riasec' : 'btn-next-cat');
      if (btn) btn.disabled = !catDone;

      // update progress bar
      const totalAnswered = Object.values(state.answers).reduce((a,b) => a + b.length, 0);
      const fill = document.querySelector('.q-progress-fill');
      if (fill) fill.style.width = Math.round(totalAnswered / 30 * 100) + '%';
    });
  });

  // Obj1 → Interests
  on('btn-goto-interests', () => { state.step = 3; render(); });
  on('btn-back-to-obj1',   () => { state.step = 2; render(); });

  // Submit interests
  on('btn-submit-interests', async () => {
    const txt = document.getElementById('interest-text')?.value.trim() || '';
    if (!txt) { state.error = 'Please describe your interests before continuing.'; render(); return; }
    state.interestText = txt;
    state.error = null;
    setLoading(true);
    try {
      const result = await apiCall('/api/objective2', { user_text: txt });
      state.obj2Result = result;
      state.step = 4;
    } catch(e) {
      state.error = e.message;
    }
    setLoading(false);
  });

  // Career cards
  document.querySelectorAll('.career-card[data-title]').forEach(card => {
    card.addEventListener('click', () => {
      state.selectedCareer = card.dataset.title;
      render();
    });
  });

  // Top10 nav
  on('btn-back-to-interests', () => { state.step = 3; render(); });
  on('btn-goto-skillgap', () => {
    if (!state.selectedCareer) return;
    state.error = null;
    state.step = 5;
    render();
  });

  // Skill gap
  on('btn-back-to-top10',              () => { state.step = 4; render(); });
  on('btn-back-to-top10-from-results', () => { state.step = 4; render(); });

  on('btn-submit-skills', async () => {
    const skills = document.getElementById('skill-input')?.value.trim() || '';
    state.userSkills = skills;
    state.error = null;
    setLoading(true);
    try {
      const result = await apiCall('/api/objective3', {
        selected_title: state.selectedCareer,
        user_skills: skills,
      });
      state.gapResult = result;
      state.step = 6;
    } catch(e) {
      state.error = e.message;
    }
    setLoading(false);
  });

  // Restart
  on('btn-restart', () => {
    Object.assign(state, {
      step: 0, answers: {}, obj1Result: null, interestText: '',
      obj2Result: null, selectedCareer: null, userSkills: '', gapResult: null,
      loading: false, error: null,
    });
    currentCatIdx = 0;
    render();
  });
}

function on(id, fn) {
  const el = document.getElementById(id);
  if (el) el.addEventListener('click', fn);
}

// ─── BOOT ────────────────────────────────────────────
render();
</script>

</html>
